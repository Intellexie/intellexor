<!doctype html>
<html lang="en" data-color-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Intellexor</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="bg" aria-hidden="true">
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
</div>
<div id="app">
  <aside class="rail">
    <a class="rail-brand" href="/" title="Intellexor"><img src="/logo.png" alt="Intellexor"></a>
    <button class="rail-btn" id="rail-sidebar" title="Toggle sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    <button class="rail-btn" id="rail-board-panel" title="Toggle cards panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg></button>
    <button class="rail-project" id="rail-project" title="Current project"><span id="rail-avatar">P</span></button>
    <button class="rail-btn" id="rail-new" title="Open project"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="rail-settings" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </aside>
  <aside class="board-panel" id="board-panel">
    <div class="board-panel-head">
      <span class="board-panel-title">Board</span>
      <span class="board-panel-count" id="board-panel-count">0</span>
      <button class="board-panel-expand" id="board-panel-expand" title="Open the full board"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
    </div>
    <div class="board-panel-list" id="board-panel-list"></div>
  </aside>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title" id="sidebar-title">Project</div>
    <button class="new-session" id="btn-new-session">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>New session</span>
    </button>
    <div class="session-list" id="session-list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/purify.min.js"></script>
<script src="/marked.min.js"></script>
<script src="/mic.js"></script>
<script src="/bg.js"></script>
<script src="/app.js"></script>
</body>
</html>
