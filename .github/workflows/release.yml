# Release pipeline: test -> cross-compile 6 targets -> checksums -> GitHub release.
#
# Trigger by pushing a version tag:
#
#   git tag v1.16.0 && git push origin v1.16.0
#
# Can also be run manually (Actions tab) to test builds; manual runs skip the
# release-publish step.
#
# The project is pure Go with zero external dependencies and an embedded web
# UI (go:embed), so every target cross-compiles from a single linux runner
# with CGO disabled — no per-OS runners needed.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY: intellexor

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/Intellexie/intellexor/internal/session.Version=${GITHUB_REF_NAME}" \
            -o "dist/${BINARY}${ext}" ./cmd/intellexor

      - name: Package
        shell: bash
        run: |
          name="${BINARY}-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "pkg/${BINARY}"
          cp dist/"${BINARY}"* "pkg/${BINARY}/"
          cp README.md "pkg/${BINARY}/"
          if [ "$GOOS" = "windows" ]; then
            (cd pkg && zip -q -r "../dist/${name}.zip" "${BINARY}")
          else
            (cd pkg && tar -czf "../dist/${name}.tar.gz" "${BINARY}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Intellexor ${GITHUB_REF_NAME}" \
            --generate-notes
