# Release pipeline: test -> build ONE binary per platform -> checksums ->
# GitHub release.
#
# Trigger by pushing a version tag:
#
#   git tag v1.16.0 && git push origin v1.16.0
#
# Can also be run manually (Actions tab) to test builds; manual runs skip the
# release-publish step.
#
# ONE app, ONE binary per platform: every target is built with
# -tags "desktop,production" — the Wails webview window on top of the same
# server. There is no separate "headless" variant: --headless is an argument,
# not a build. Per-OS toolchain notes:
#
#   windows/*  Wails' webview2 bindings are pure Go — cross-compiles from the
#              linux runner with CGO disabled; -H windowsgui hides the console.
#   linux/*    cgo against GTK/WebKit (noble ships webkit2gtk-4.1 only, hence
#              webkit2_41). The binary dynamically links libgtk/libwebkit —
#              present on any desktop distro; servers use the Docker image,
#              which builds its own CGO-free headless binary.
#   darwin/*   cgo + macOS SDK, built on macOS runners (amd64 cross-compiles
#              from the arm64 runner). Wails' darwin frontend forgets to link
#              UniformTypeIdentifiers (UTType) — supplied via CGO_LDFLAGS.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY: intellexor

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The desktop-tagged code (Wails bridge) compiles without GUI headers
      # (the production-less tag uses Wails' pure-Go stub) and carries its
      # own bridge tests — keep them in the gate.
      - name: Vet (desktop tag)
        run: go vet -tags desktop ./...

      - name: Test (desktop tag)
        run: go test -tags desktop ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runs-on: ubuntu-latest,    tags: "desktop,production,webkit2_41", cgo: "1" }
          - { goos: linux,   goarch: arm64, runs-on: ubuntu-24.04-arm, tags: "desktop,production,webkit2_41", cgo: "1" }
          - { goos: windows, goarch: amd64, runs-on: ubuntu-latest,    tags: "desktop,production", cgo: "0", gui: "1" }
          - { goos: windows, goarch: arm64, runs-on: ubuntu-latest,    tags: "desktop,production", cgo: "0", gui: "1" }
          - { goos: darwin,  goarch: arm64, runs-on: macos-latest,     tags: "desktop,production", cgo: "1" }
          - { goos: darwin,  goarch: amd64, runs-on: macos-latest,     tags: "desktop,production", cgo: "1", cc: "clang -arch x86_64" }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: ${{ matrix.cgo }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GUI dev headers (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          ldflags="-s -w -X github.com/Intellexie/intellexor/internal/session.Version=${GITHUB_REF_NAME}"
          if [ "$GOOS" = "windows" ]; then ldflags="-H windowsgui $ldflags"; fi
          if [ -n "${{ matrix.cc }}" ]; then export CC="${{ matrix.cc }}"; fi
          if [ "$GOOS" = "darwin" ]; then
            # Wails' darwin frontend uses UTType but never links its framework
            export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
            export CGO_LDFLAGS_ALLOW="-framework.*"
          fi
          mkdir -p dist
          go build -trimpath -tags "${{ matrix.tags }}" \
            -ldflags "$ldflags" \
            -o "dist/${BINARY}${ext}" .

      - name: Package
        shell: bash
        run: |
          name="${BINARY}-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "pkg/${BINARY}"
          cp dist/"${BINARY}"* "pkg/${BINARY}/"
          cp README.md "pkg/${BINARY}/"
          if [ "$GOOS" = "windows" ]; then
            (cd pkg && zip -q -r "../dist/${name}.zip" "${BINARY}")
          else
            (cd pkg && tar -czf "../dist/${name}.tar.gz" "${BINARY}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Intellexor ${GITHUB_REF_NAME}" \
            --generate-notes
